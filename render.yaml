services:
  - type: web
    name: pdf-tools-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: ""
    startCommand: cd backend && pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: pdf-storage
      mountPath: /backend/uploads
      sizeGB: 1
    healthCheckPath: /
